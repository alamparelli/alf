<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title><!-- APP_NAME --></title>
  <!-- ══ REQUIRED: Theme (3 files) — do NOT change ══ -->
  <link rel="stylesheet" id="alf-theme" href="/static/theme-sage.css">
  <script src="/static/theme-init.js"></script>
  <script src="/static/alf-app-sdk.js"></script>
  <!-- alf-ui.css is auto-injected — do NOT import manually -->
  <!-- ══ CUSTOM CSS: only for app-specific visuals with no alf-ui equivalent ══ -->
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    /* Add ONLY app-specific styles here (game canvas, custom charts, etc.)
       Do NOT duplicate alf-ui.css classes. Check reference/AIG-COMPONENTS.md first. */
  </style>
</head>
<body>
<div class="app-shell">

  <!-- ══ HEADER: title + actions ══ -->
  <div class="app-header">
    <h1 class="app-header-title"><!-- APP_NAME --></h1>
    <span class="spacer"></span>
    <div class="app-header-actions">
      <button class="btn btn-primary btn-sm" onclick="showAdd()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Add
      </button>
    </div>
  </div>

  <div class="app-body">

    <!-- ══ STATS: use stat-grid (not custom divs) ══ -->
    <div class="stat-grid" id="stats">
      <div class="stat-item">
        <div class="stat-bar" style="background:var(--accent)"></div>
        <div class="stat-value" id="stat-1">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-item">
        <div class="stat-bar" style="background:var(--green)"></div>
        <div class="stat-value" id="stat-2">0</div>
        <div class="stat-label">Active</div>
      </div>
      <div class="stat-item">
        <div class="stat-bar" style="background:var(--sapphire)"></div>
        <div class="stat-value" id="stat-3">0%</div>
        <div class="stat-label">Rate</div>
      </div>
    </div>

    <!-- ══ FILTERS: use filter-tabs (not custom buttons) ══ -->
    <div class="filter-tabs mb-md">
      <button class="tab active" onclick="setFilter('all',this)">All</button>
      <button class="tab" onclick="setFilter('active',this)">Active</button>
      <button class="tab" onclick="setFilter('done',this)">Done</button>
    </div>

    <!-- ══ LIST: use card-group + list-item-interactive ══ -->
    <div id="list"></div>

    <!-- ══ EMPTY STATE: use empty-state class ══ -->
    <div id="empty" class="empty-state hidden">
      <p>No items yet. Add one to get started.</p>
      <button class="btn btn-primary btn-sm" onclick="showAdd()">Add first item</button>
    </div>

  </div>
</div>

<script>
// ══ REQUIRED: Theme sync (2 args: palette, isDark) ══
AlfSDK.init({
  slug: '<!-- APP_SLUG -->',
  onThemeChange: function(palette, isDark) {
    document.getElementById('alf-theme').href = '/static/theme-' + palette + '.css';
  }
});

var SLUG = '<!-- APP_SLUG -->';
var items = [];
var filter = 'all';

// ══ RENDER: compose with alf-ui.css classes, no inline styles ══
function render() {
  var filtered = items.filter(function(item) {
    if (filter === 'active') return !item.done;
    if (filter === 'done') return item.done;
    return true;
  });

  // Stats
  var total = items.length;
  var active = items.filter(function(i) { return !i.done; }).length;
  var rate = total ? Math.round((items.filter(function(i) { return i.done; }).length / total) * 100) : 0;
  document.getElementById('stat-1').textContent = total;
  document.getElementById('stat-2').textContent = active;
  document.getElementById('stat-3').textContent = rate + '%';

  // List
  var el = document.getElementById('list');
  var empty = document.getElementById('empty');

  if (!filtered.length) {
    el.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  el.innerHTML = '<div class="card-group">' + filtered.map(function(item) {
    return '<div class="list-item-interactive">' +
      '<div class="check' + (item.done ? ' checked' : '') + '" onclick="toggle(\'' + item.id + '\')"></div>' +
      '<span class="flex-1">' + esc(item.name) + '</span>' +
      (item.tag ? '<span class="tag tag-accent">' + esc(item.tag) + '</span>' : '') +
      '<button class="btn-icon" onclick="showEdit(\'' + item.id + '\')" data-tooltip="Edit">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' +
      '</button>' +
      '<button class="btn-icon" onclick="remove(\'' + item.id + '\')" data-tooltip="Delete">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>' +
      '</button>' +
    '</div>';
  }).join('') + '</div>';
}

// ══ CRUD: AlfSDK.storage for frontend-only apps ══
function save() {
  AlfSDK.storage.set('items', items);
}

function load() {
  AlfSDK.storage.get('items').then(function(data) {
    items = data || [];
    render();
  });
}

function toggle(id) {
  var item = items.find(function(i) { return i.id === id; });
  if (item) { item.done = !item.done; save(); render(); AlfSDK.haptics.tap(); }
}

function remove(id) {
  var item = items.find(function(i) { return i.id === id; });
  if (!item) return;
  AlfSDK.confirm('Delete "' + item.name + '"?').then(function(ok) {
    if (!ok) return;
    items = items.filter(function(i) { return i.id !== id; });
    save(); render();
    AlfSDK.toast('Deleted', 'info');
  });
}

// ══ ADD/EDIT: use AlfSDK.sheet() with alf-ui.css form classes ══
function showAdd() {
  AlfSDK.sheet(
    '<h3>Add Item</h3>' +
    '<hr class="divider">' +
    '<div class="form-group">' +
      '<label class="form-label">Name</label>' +
      '<input class="input" name="name" placeholder="Enter name...">' +
    '</div>' +
    '<div class="modal-actions">' +
      '<button data-action="cancel" class="btn">Cancel</button>' +
      '<button data-action="save" class="btn btn-primary">Add</button>' +
    '</div>',
    {
      cancel: function() { AlfSDK.closeSheet(); },
      save: function(p) {
        if (!p.name || !p.name.trim()) { AlfSDK.toast('Name is required', 'error'); return; }
        items.push({ id: genId(), name: p.name.trim(), done: false });
        save(); render();
        AlfSDK.closeSheet();
        AlfSDK.toast('Added', 'success');
      }
    }
  );
}

function showEdit(id) {
  var item = items.find(function(i) { return i.id === id; });
  if (!item) return;
  AlfSDK.sheet(
    '<h3>Edit Item</h3>' +
    '<hr class="divider">' +
    '<div class="form-group">' +
      '<label class="form-label">Name</label>' +
      '<input class="input" name="name" value="' + esc(item.name) + '">' +
    '</div>' +
    '<div class="modal-actions">' +
      '<button data-action="cancel" class="btn">Cancel</button>' +
      '<button data-action="save" class="btn btn-primary">Save</button>' +
    '</div>',
    {
      cancel: function() { AlfSDK.closeSheet(); },
      save: function(p) {
        if (!p.name || !p.name.trim()) { AlfSDK.toast('Name is required', 'error'); return; }
        item.name = p.name.trim();
        save(); render();
        AlfSDK.closeSheet();
      }
    }
  );
}

// ══ FILTER ══
function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filter-tabs .tab').forEach(function(t) { t.classList.remove('active'); });
  btn.classList.add('active');
  render();
}

// ══ UTILS ══
function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 4); }
function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

load();
</script>
</body>
</html>
