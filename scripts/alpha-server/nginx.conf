server {
    listen 80;
    server_name _;

    # Serve install script without auth (needs to be curl-able)
    location = /alpha/install.sh {
        alias /usr/share/nginx/html/alpha/install.sh;
        default_type text/plain;
    }

    # Binary downloads require auth
    location /alpha/ {
        alias /usr/share/nginx/html/alpha/;
        auth_basic "ALF Alpha";
        auth_basic_user_file /etc/nginx/.htpasswd;
        autoindex off;
    }

    # Multi-tenant setup — public installer, auth-protected probe
    location = /s/setup.sh {
        alias /usr/share/nginx/html/s/setup.sh;
        default_type text/plain;
    }

    location /s/ {
        alias /usr/share/nginx/html/s/;
        auth_basic "Private";
        auth_basic_user_file /etc/nginx/.htpasswd-s;
        autoindex off;
    }
}
