name: alf-alpha

services:
  alpha:
    image: nginx:alpine
    container_name: alf-alpha
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./htpasswd:/etc/nginx/.htpasswd:ro
      - ./dist:/usr/share/nginx/html/alpha:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alf-alpha.rule=Host(`cc.lamparelli.eu`) && PathPrefix(`/alpha`)"
      - "traefik.http.routers.alf-alpha.entrypoints=websecure"
      - "traefik.http.routers.alf-alpha.tls.certresolver=myresolver"
      - "traefik.http.routers.alf-alpha.priority=100"
      - "traefik.http.services.alf-alpha.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"

networks:
  proxy:
    external: true
