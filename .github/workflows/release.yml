name: Build & Release

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build and push Docker image (all pushes to main + tags)
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # For keyless signing
      attestations: write  # For SBOM attestations

    steps:
      - uses: actions/checkout@v4

      - name: Check if image already exists
        id: check
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          TOKEN=$(curl -s "https://ghcr.io/token?service=ghcr.io&scope=repository:alamparelli/alf:pull" | jq -r .token)
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://ghcr.io/v2/alamparelli/alf/manifests/${VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Image ${VERSION} already exists - skipping Docker build"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Clone vault-proxy into third_party
        if: steps.check.outputs.exists != 'true'
        run: git clone --depth 1 https://github.com/alamparelli/vault-proxy.git internal/controlcenter/frontend/third_party/vault-proxy

      - name: Log in to GHCR
        if: steps.check.outputs.exists != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        if: steps.check.outputs.exists != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        if: steps.check.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        if: steps.check.outputs.exists != 'true'
        uses: sigstore/cosign-installer@v3.7.0

      - name: Install Syft
        if: steps.check.outputs.exists != 'true'
        uses: anchore/sbom-action/download-syft@v0.24.0

      - name: Sign container image
        if: steps.check.outputs.exists != 'true'
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Generate SBOM
        if: steps.check.outputs.exists != 'true'
        run: |
          syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} -o spdx-json=sbom.spdx.json

      - name: Attest SBOM
        if: steps.check.outputs.exists != 'true'
        run: |
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

  # Build and push whisper-service Docker image
  docker-whisper:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # For keyless signing
      attestations: write  # For SBOM attestations

    steps:
      - uses: actions/checkout@v4

      - name: Check if image already exists
        id: check
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          TOKEN=$(curl -s "https://ghcr.io/token?service=ghcr.io&scope=repository:alamparelli/whisper-service:pull" | jq -r .token)
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://ghcr.io/v2/alamparelli/whisper-service/manifests/${VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        if: steps.check.outputs.exists != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        if: steps.check.outputs.exists != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/alamparelli/whisper-service
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push whisper-service
        if: steps.check.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./whisper-service
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=whisper
          cache-to: type=gha,mode=max,scope=whisper

      - name: Install Cosign
        if: steps.check.outputs.exists != 'true'
        uses: sigstore/cosign-installer@v3.7.0

      - name: Install Syft
        if: steps.check.outputs.exists != 'true'
        uses: anchore/sbom-action/download-syft@v0.24.0

      - name: Sign container image
        if: steps.check.outputs.exists != 'true'
        run: |
          cosign sign --yes ghcr.io/alamparelli/whisper-service@${{ steps.build.outputs.digest }}

      - name: Generate SBOM
        if: steps.check.outputs.exists != 'true'
        run: |
          syft ghcr.io/alamparelli/whisper-service@${{ steps.build.outputs.digest }} -o spdx-json=sbom.spdx.json

      - name: Attest SBOM
        if: steps.check.outputs.exists != 'true'
        run: |
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson ghcr.io/alamparelli/whisper-service@${{ steps.build.outputs.digest }}

  # Build CLI binaries and create GitHub Release (tags only)
  cli:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Clone vault-proxy dependency
        run: |
          git clone --depth 1 https://github.com/alamparelli/vault-proxy.git /tmp/vault-proxy
          go mod edit -replace github.com/alessandrolamparelli/vault-proxy=/tmp/vault-proxy

      - name: Build CLI binaries
        run: |
          VERSION=${GITHUB_REF_NAME}
          LDFLAGS="-s -w -X main.version=${VERSION}"

          CGO_ENABLED=0 GOOS=linux  GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/alf-linux-amd64  ./cmd/alf
          CGO_ENABLED=0 GOOS=linux  GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/alf-linux-arm64  ./cmd/alf
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/alf-darwin-amd64 ./cmd/alf
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/alf-darwin-arm64 ./cmd/alf

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/alf-*
