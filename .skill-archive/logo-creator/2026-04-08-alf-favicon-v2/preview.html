<!DOCTYPE html>

  h1 { text-align: center; color: #863bff; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; max-width: 900px; margin: 2rem auto; }
  .card { background: #16213e; border-radius: 12px; padding: 1rem; text-align: center; }
  .card img { width: 100%; border-radius: 8px; }
  .card .label { margin-top: 0.5rem; font-size: 14px; color: #888; }
  .card .preview { margin-top: 0.5rem; display: flex; gap: 8px; justify-content: center; align-items: center; }
  .card .preview img { width: 48px; height: 48px; border-radius: 4px; }
  .card .preview .tiny { width: 16px; height: 16px; }
  .card .preview .small { width: 32px; height: 32px; }
</style></head><body>
