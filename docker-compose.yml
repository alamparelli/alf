name: alf-dev

services:
  alf:
    build: .
    container_name: alf
    ports:
      - "2222:22"
      - "127.0.0.1:8080:8080"
    environment:
      - TELEGRAM_BOT_TOKEN_FILE=/run/secrets/telegram_bot_token
      - TELEGRAM_CHAT_ID_FILE=/run/secrets/telegram_chat_id
      - CC_AUTH_TOKEN_FILE=/run/secrets/cc_auth_token
    secrets:
      - telegram_bot_token
      - telegram_chat_id
      - cc_auth_token
    volumes:
      - ./dev-data:/home/node/data
      - ./dev-claude-session:/home/node/.claude
    mem_limit: 512m
    cpus: "0.5"

secrets:
  telegram_bot_token:
    file: ./dev-secrets/telegram_bot_token
  telegram_chat_id:
    file: ./dev-secrets/telegram_chat_id
  cc_auth_token:
    file: ./dev-secrets/cc_auth_token
