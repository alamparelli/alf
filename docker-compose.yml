name: alf-dev

services:
  alf:
    build: .
    container_name: alf
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - TELEGRAM_BOT_TOKEN_FILE=/run/secrets/telegram_bot_token
      - TELEGRAM_CHAT_ID_FILE=/run/secrets/telegram_chat_id
      - CC_AUTH_TOKEN_FILE=/run/secrets/cc_auth_token
    secrets:
      - source: telegram_bot_token
        uid: "1001"
        gid: "1001"
        mode: 0400
      - source: telegram_chat_id
        uid: "1001"
        gid: "1001"
        mode: 0400
      - source: cc_auth_token
        uid: "1001"
        gid: "1001"
        mode: 0400
    volumes:
      - ./dev-data:/home/alf/data
      - ./dev-cache/claude:/home/alf/.claude
      - ./dev-cache/local:/home/alf/.local
      - ./dev-cache/npm:/home/alf/.npm
      - ./dev-cache/cache:/home/alf/.cache
    mem_limit: 512m
    cpus: "0.5"

secrets:
  telegram_bot_token:
    file: ./dev-secrets/telegram_bot_token
  telegram_chat_id:
    file: ./dev-secrets/telegram_chat_id
  cc_auth_token:
    file: ./dev-secrets/cc_auth_token
