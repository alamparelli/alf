<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="auth-token" content="{{AUTH_TOKEN}}">
  <title>ALF Control Center</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1><span>ALF</span> Control Center</h1>
      <div class="header-controls">
        <button class="toggle-btn" id="advancedToggle">Advanced</button>
        <button class="toggle-btn" id="themeToggle">Light</button>
      </div>
    </header>

    <!-- Status Card -->
    <div class="card" id="statusCard">
      <h2>Status</h2>
      <div class="status-grid">
        <div class="stat">
          <div class="stat-value"><span class="dot green" id="statusDot"></span><span id="statusText">--</span></div>
          <div class="stat-label">Status</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="uptimeValue">--</div>
          <div class="stat-label">Uptime</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="msgCount">0</div>
          <div class="stat-label">Messages</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="lastMsg">--</div>
          <div class="stat-label">Last Message</div>
        </div>
      </div>
    </div>

    <!-- Quick Config Card -->
    <div class="card">
      <h2>Configuration</h2>
      <div class="form-row">
        <label for="cfgModel">Model</label>
        <select id="cfgModel">
          <option value="haiku">Haiku</option>
          <option value="sonnet" selected>Sonnet</option>
          <option value="opus">Opus</option>
        </select>
      </div>
      <div class="form-row">
        <label for="cfgLogLevel">Log Level</label>
        <select id="cfgLogLevel">
          <option value="debug">Debug</option>
          <option value="info" selected>Info</option>
          <option value="warn">Warn</option>
          <option value="error">Error</option>
        </select>
      </div>
      <div class="form-row">
        <label for="cfgQuietStart">Quiet Hours</label>
        <input type="number" id="cfgQuietStart" min="0" max="23" value="0" style="width:60px">
        <span style="color:var(--text-dim)">to</span>
        <input type="number" id="cfgQuietEnd" min="0" max="23" value="0" style="width:60px">
      </div>
      <div class="btn-row">
        <button class="btn" id="saveConfigBtn">Save</button>
      </div>
    </div>

    <!-- Recent Logs -->
    <div class="card">
      <h2>Recent Logs</h2>
      <div class="log-box" id="logBox">Loading...</div>
    </div>

    <!-- Advanced: Raw Config Editor -->
    <div class="card advanced" id="rawConfigCard">
      <h2>Raw Config (JSON)</h2>
      <textarea class="json-editor" id="rawConfigEditor"></textarea>
      <div class="btn-row">
        <button class="btn" id="saveRawConfigBtn">Save Raw Config</button>
      </div>
    </div>

    <!-- Advanced: Tiers Editor -->
    <div class="card advanced" id="tiersCard">
      <h2>Tiers</h2>
      <table class="tier-table">
        <thead><tr><th>Name</th><th>Model</th><th>Priority</th><th>Enabled</th></tr></thead>
        <tbody id="tiersBody"></tbody>
      </table>
      <div class="btn-row" style="gap:8px">
        <button class="btn" id="addTierBtn" style="background:var(--border);color:var(--text)">+ Add Tier</button>
        <button class="btn" id="saveTiersBtn">Save Tiers</button>
      </div>
    </div>

    <!-- Advanced: Full Log Viewer -->
    <div class="card advanced" id="fullLogsCard">
      <h2>Full Log Viewer</h2>
      <div class="form-row">
        <label for="logFileName">File</label>
        <select id="logFileName"></select>
        <label for="logLines">Lines</label>
        <input type="number" id="logLines" value="200" min="1" max="1000" style="width:80px">
        <button class="btn" id="fetchLogsBtn">Fetch</button>
      </div>
      <div class="log-box" id="fullLogBox" style="max-height:500px"></div>
    </div>

    <!-- Advanced: System Info -->
    <div class="card advanced" id="sysInfoCard">
      <h2>System Info</h2>
      <div id="sysInfo" style="font-size:0.85rem;color:var(--text-dim)">Loading...</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
