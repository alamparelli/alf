<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALF OS — Prototype Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0d;
    --surface: #141418;
    --card: #1a1a1f;
    --card-hover: #222228;
    --border: #2a2a30;
    --text: #e4e2dc;
    --text-muted: #8a8880;
    --accent: #6fc472;
    --accent-dim: rgba(111, 196, 114, 0.12);
    --font-display: 'Sora', sans-serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* Grain overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.025;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
  }

  /* Top bar */
  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 48px;
    background: rgba(14, 14, 18, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    z-index: 100;
  }

  .topbar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
  }

  .topbar-brand .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px rgba(111, 196, 114, 0.5);
  }

  .topbar-nav {
    display: flex;
    gap: 4px;
  }

  .topbar-nav a {
    color: var(--text-muted);
    text-decoration: none;
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 6px;
    transition: all 0.2s ease;
    position: relative;
  }

  .topbar-nav a:hover {
    color: var(--text);
    background: var(--accent-dim);
  }

  .topbar-nav a.active {
    color: var(--accent);
    background: var(--accent-dim);
  }

  .topbar-count {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
  }

  /* Hero */
  .hero {
    padding: 140px 32px 60px;
    text-align: center;
    position: relative;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 400px;
    background: radial-gradient(ellipse, rgba(111, 196, 114, 0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero h1 {
    font-family: var(--font-display);
    font-size: clamp(32px, 5vw, 52px);
    font-weight: 700;
    letter-spacing: -1px;
    margin-bottom: 12px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
  }

  .hero h1 span {
    color: var(--accent);
  }

  .hero p {
    color: var(--text-muted);
    font-size: 16px;
    max-width: 500px;
    margin: 0 auto;
    line-height: 1.6;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.1s forwards;
  }

  /* Gallery grid */
  .gallery {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 32px 100px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
    gap: 24px;
  }

  .proto-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    opacity: 0;
    animation: fadeUp 0.5s ease forwards;
    cursor: pointer;
    position: relative;
  }

  .proto-card:nth-child(1)  { animation-delay: 0.03s; }
  .proto-card:nth-child(2)  { animation-delay: 0.06s; }
  .proto-card:nth-child(3)  { animation-delay: 0.09s; }
  .proto-card:nth-child(4)  { animation-delay: 0.12s; }
  .proto-card:nth-child(5)  { animation-delay: 0.15s; }
  .proto-card:nth-child(6)  { animation-delay: 0.18s; }
  .proto-card:nth-child(7)  { animation-delay: 0.21s; }
  .proto-card:nth-child(8)  { animation-delay: 0.24s; }
  .proto-card:nth-child(9)  { animation-delay: 0.27s; }
  .proto-card:nth-child(10) { animation-delay: 0.30s; }
  .proto-card:nth-child(11) { animation-delay: 0.33s; }
  .proto-card:nth-child(12) { animation-delay: 0.36s; }
  .proto-card:nth-child(13) { animation-delay: 0.39s; }
  .proto-card:nth-child(14) { animation-delay: 0.42s; }
  .proto-card:nth-child(15) { animation-delay: 0.45s; }
  .proto-card:nth-child(16) { animation-delay: 0.48s; }
  .proto-card:nth-child(17) { animation-delay: 0.51s; }
  .proto-card:nth-child(18) { animation-delay: 0.54s; }
  .proto-card:nth-child(19) { animation-delay: 0.57s; }
  .proto-card:nth-child(20) { animation-delay: 0.60s; }
  .proto-card:nth-child(21) { animation-delay: 0.63s; }

  .proto-card:hover {
    transform: translateY(-4px);
    border-color: rgba(111, 196, 114, 0.3);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(111, 196, 114, 0.1);
  }

  /* Preview iframe */
  .proto-preview {
    width: 100%;
    aspect-ratio: 16 / 10;
    position: relative;
    overflow: hidden;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }

  .proto-preview iframe {
    width: 200%;
    height: 200%;
    border: none;
    transform: scale(0.5);
    transform-origin: top left;
    pointer-events: none;
  }

  .proto-preview .overlay {
    position: absolute;
    inset: 0;
    background: transparent;
    z-index: 2;
  }

  /* Card info */
  .proto-info {
    padding: 20px 24px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }

  .proto-info-left {
    flex: 1;
  }

  .proto-number {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 4px;
    letter-spacing: 1px;
  }

  .proto-name {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .proto-desc {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .proto-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .proto-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    background: rgba(255, 255, 255, 0.04);
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }

  .proto-open {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent);
    background: var(--accent-dim);
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 4px;
  }

  .proto-open:hover {
    background: rgba(111, 196, 114, 0.2);
    transform: translateX(2px);
  }

  .proto-open svg {
    width: 14px;
    height: 14px;
  }

  /* Fullscreen viewer */
  .viewer {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: var(--bg);
  }

  .viewer.active {
    display: flex;
    flex-direction: column;
  }

  .viewer-bar {
    height: 48px;
    background: rgba(14, 14, 18, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    flex-shrink: 0;
  }

  .viewer-bar-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .viewer-close {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.2s ease;
  }

  .viewer-close:hover {
    background: rgba(255, 255, 255, 0.06);
    border-color: var(--text-muted);
  }

  .viewer-title {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 500;
  }

  .viewer-title span {
    color: var(--text-muted);
    font-weight: 400;
  }

  .viewer-nav {
    display: flex;
    gap: 4px;
  }

  .viewer-nav button {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 12px;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .viewer-nav button:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.04);
    border-color: var(--text-muted);
  }

  .viewer-nav button:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .viewer-bar-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .viewer-dots {
    display: flex;
    gap: 6px;
    margin-right: 12px;
  }

  .viewer-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .viewer-dot.active {
    background: var(--accent);
    box-shadow: 0 0 6px rgba(111, 196, 114, 0.4);
  }

  .viewer-dot:hover {
    background: var(--text-muted);
  }

  .viewer-newtab {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    text-decoration: none;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    transition: all 0.2s ease;
  }

  .viewer-newtab:hover {
    color: var(--accent);
    border-color: rgba(111, 196, 114, 0.3);
  }

  .viewer-frame {
    flex: 1;
    overflow: hidden;
  }

  .viewer-frame iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  /* Keyboard hints */
  .kb-hints {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 16px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    opacity: 0;
    animation: fadeUp 0.5s ease 0.6s forwards;
    z-index: 50;
  }

  .kb-hints kbd {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 11px;
    margin-right: 4px;
  }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0s !important;
      transition-duration: 0s !important;
    }
  }

  @media (max-width: 860px) {
    .gallery { grid-template-columns: 1fr; }
    .topbar-nav { display: none; }
    .kb-hints { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <div class="dot"></div>
    ALF OS — Prototype Gallery
  </div>
  <nav class="topbar-nav" id="topnav"></nav>
  <div class="topbar-count">21 prototypes</div>
</div>

<section class="hero">
  <h1>ALF <span>OS</span> Redesign</h1>
  <p>21 variations — Minimal + Soft Studio. Cliquez pour voir en plein ecran.</p>
</section>

<section class="gallery" id="gallery"></section>

<div class="kb-hints">
  <span><kbd>←</kbd> <kbd>→</kbd> naviguer</span>
  <span><kbd>ESC</kbd> fermer</span>
  <span><kbd>1</kbd>-<kbd>0</kbd> acceder</span>
</div>

<!-- Fullscreen viewer -->
<div class="viewer" id="viewer">
  <div class="viewer-bar">
    <div class="viewer-bar-left">
      <button class="viewer-close" id="viewerClose">&times;</button>
      <div class="viewer-title" id="viewerTitle"></div>
      <div class="viewer-nav">
        <button id="prevBtn" onclick="navigate(-1)">&#8592; Prev</button>
        <button id="nextBtn" onclick="navigate(1)">Next &#8594;</button>
      </div>
    </div>
    <div class="viewer-bar-right">
      <div class="viewer-dots" id="viewerDots"></div>
      <a class="viewer-newtab" id="viewerNewTab" href="#" target="_blank">Open in tab &#8599;</a>
    </div>
  </div>
  <div class="viewer-frame">
    <iframe id="viewerFrame" src="about:blank"></iframe>
  </div>
</div>

<script>
const prototypes = [
  // — Minimal / Modern series —
  {
    num: 'm1',
    name: 'Ink Minimal',
    desc: 'Ultra clean, epure. Typographie nette, espaces genereux.',
    tags: ['minimal', 'clean', 'ink', 'typography'],
    file: 'proto-m1.html'
  },
  {
    num: 'm2',
    name: 'Soft Studio',
    desc: 'Charcoal chaud, accent ambre, coins doux. Le design de reference.',
    tags: ['baseline', 'amber', 'warm', 'reference'],
    file: 'proto-m2.html'
  },
  {
    num: 'm3',
    name: 'Paper Dark',
    desc: 'Esthetique editoriale avec typographie serif. Ambiance journal.',
    tags: ['serif', 'editorial', 'paper', 'dark'],
    file: 'proto-m3.html'
  },
  {
    num: 'm4',
    name: 'Slate Grid',
    desc: 'Sidebar pliable + dashboard en grille. Structuree et modulaire.',
    tags: ['grid', 'collapsible', 'modular', 'dashboard'],
    file: 'proto-m4.html'
  },
  {
    num: 'm5',
    name: 'Vercel Clean',
    desc: 'Navigation horizontale header, pas de sidebar. Style Vercel/Next.',
    tags: ['no-sidebar', 'header-nav', 'vercel', 'horizontal'],
    file: 'proto-m5.html'
  },
  {
    num: 'm6',
    name: 'Split Duo',
    desc: 'Chat persistant + panneaux de contenu switchables. Dual panel.',
    tags: ['split', 'chat', 'dual-panel', 'persistent'],
    file: 'proto-m6.html'
  },
  {
    num: 'm7',
    name: 'Pill Nav',
    desc: 'Navigation flottante en bas, inspiree mobile. Bottom dock.',
    tags: ['bottom-nav', 'floating', 'mobile', 'pill'],
    file: 'proto-m7.html'
  },
  {
    num: 'm8',
    name: 'Dense Terminal',
    desc: 'Full monospace, esthetique terminal/hacker. Information dense.',
    tags: ['monospace', 'terminal', 'hacker', 'dense'],
    file: 'proto-m8.html'
  },
  {
    num: 'm9',
    name: 'Status Pills',
    desc: 'Design avec pills de statut, accent bleu ciel, typographie Karla.',
    tags: ['pills', 'sky-blue', 'status', 'karla'],
    file: 'proto-m9.html'
  },
  {
    num: 'm10',
    name: 'Control Center',
    desc: 'Layout centre de controle complet avec sections detaillees.',
    tags: ['control-center', 'full', 'sections', 'detailed'],
    file: 'proto-m10.html'
  },
  // — Soft Studio variations —
  {
    num: 's1',
    name: 'Sage Green',
    desc: 'Meme design, accent sage green au lieu de ambre. Plus calme.',
    tags: ['sage', 'green', 'calmer', 'natural'],
    file: 'proto-s1.html'
  },
  {
    num: 's2',
    name: 'Profile + Search',
    desc: 'Sidebar elargie 260px avec avatar, profil, search bar, nav groupee.',
    tags: ['profile', 'search', 'wide-sidebar', 'grouped'],
    file: 'proto-s2.html'
  },
  {
    num: 's3',
    name: 'Collapsible + CmdK',
    desc: 'Sidebar pliable 220/56px + command palette Cmd+K integre.',
    tags: ['collapsible', 'cmd-k', 'palette', 'power-user'],
    file: 'proto-s3.html'
  },
  {
    num: 's4',
    name: 'Lighter Charcoal',
    desc: 'Palette plus claire — meme layout, tons de gris plus lumineux. Shadows au lieu de borders.',
    tags: ['lighter', 'shadows', 'warmer', 'brighter'],
    file: 'proto-s4.html'
  },
  {
    num: 's5',
    name: 'Compact Dense',
    desc: 'Info-dense, sidebar 180px, 4-col cards, tasks + skills visibles. Power user.',
    tags: ['compact', 'dense', 'info-rich', '4-col'],
    file: 'proto-s5.html'
  },
  {
    num: 's6',
    name: 'Chat Split',
    desc: 'Chat toujours visible a droite (45%), contenu switchable a gauche (55%).',
    tags: ['split', 'chat-always', 'dual-panel', 'multitask'],
    file: 'proto-s6.html'
  },
  {
    num: 's7',
    name: 'Breadcrumb Bar',
    desc: 'Barre header avec breadcrumb + actions (search, notifications, settings).',
    tags: ['breadcrumb', 'header-bar', 'navigation', 'actions'],
    file: 'proto-s7.html'
  },
  {
    num: 's8',
    name: 'Widget Dashboard',
    desc: 'Dashboard 3-col avec plus de widgets: system, model, tasks, activity, skills.',
    tags: ['widgets', '3-col', 'dashboard', 'rich'],
    file: 'proto-s8.html'
  },
  {
    num: 's9',
    name: 'Pill Rounded',
    desc: 'Tout en pills et arrondis. Quicksand font, plus de padding, look friendly.',
    tags: ['rounded', 'pills', 'friendly', 'soft'],
    file: 'proto-s9.html'
  },
  {
    num: 's10',
    name: 'Ultra Flat',
    desc: 'Zero borders, zero shadows. Separation par spacing et micro-differences de bg.',
    tags: ['flat', 'no-borders', 'minimal', 'extreme'],
    file: 'proto-s10.html'
  }
];

let currentIndex = -1;

// Build gallery
const gallery = document.getElementById('gallery');
const topnav = document.getElementById('topnav');

prototypes.forEach((proto, i) => {
  // Gallery card
  const card = document.createElement('div');
  card.className = 'proto-card';
  card.onclick = () => openViewer(i);
  card.innerHTML = `
    <div class="proto-preview">
      <iframe src="${proto.file}" loading="lazy" sandbox="allow-scripts allow-same-origin" tabindex="-1"></iframe>
      <div class="overlay"></div>
    </div>
    <div class="proto-info">
      <div class="proto-info-left">
        <div class="proto-number">PROTO ${proto.num}</div>
        <div class="proto-name">${proto.name}</div>
        <div class="proto-desc">${proto.desc}</div>
        <div class="proto-tags">
          ${proto.tags.map(t => `<span class="proto-tag">${t}</span>`).join('')}
        </div>
      </div>
      <button class="proto-open" onclick="event.stopPropagation(); openViewer(${i})">
        View
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </button>
    </div>
  `;
  gallery.appendChild(card);

  // Top nav link
  const link = document.createElement('a');
  link.href = '#';
  link.textContent = proto.num;
  link.title = proto.name;
  link.onclick = (e) => { e.preventDefault(); openViewer(i); };
  topnav.appendChild(link);
});

// Viewer
const viewer = document.getElementById('viewer');
const viewerFrame = document.getElementById('viewerFrame');
const viewerTitle = document.getElementById('viewerTitle');
const viewerNewTab = document.getElementById('viewerNewTab');
const viewerDots = document.getElementById('viewerDots');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

// Build dots
prototypes.forEach((_, i) => {
  const dot = document.createElement('div');
  dot.className = 'viewer-dot';
  dot.onclick = () => openViewer(i);
  viewerDots.appendChild(dot);
});

function openViewer(index) {
  currentIndex = index;
  const proto = prototypes[index];

  viewer.classList.add('active');
  viewerFrame.src = proto.file;
  viewerTitle.innerHTML = `<span>Proto ${proto.num}</span>&ensp;${proto.name}`;
  viewerNewTab.href = proto.file;

  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === prototypes.length - 1;

  document.querySelectorAll('.viewer-dot').forEach((d, i) => {
    d.classList.toggle('active', i === index);
  });

  document.querySelectorAll('.topbar-nav a').forEach((a, i) => {
    a.classList.toggle('active', i === index);
  });

  document.body.style.overflow = 'hidden';
}

function closeViewer() {
  viewer.classList.remove('active');
  viewerFrame.src = 'about:blank';
  currentIndex = -1;
  document.body.style.overflow = '';
  document.querySelectorAll('.topbar-nav a').forEach(a => a.classList.remove('active'));
}

function navigate(dir) {
  const next = currentIndex + dir;
  if (next >= 0 && next < prototypes.length) {
    openViewer(next);
  }
}

document.getElementById('viewerClose').onclick = closeViewer;

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (viewer.classList.contains('active')) {
    if (e.key === 'Escape') closeViewer();
    else if (e.key === 'ArrowLeft') navigate(-1);
    else if (e.key === 'ArrowRight') navigate(1);
  }

  // Number keys 1-0 to jump to prototypes
  const num = e.key === '0' ? 10 : parseInt(e.key);
  if (num >= 1 && num <= 10 && !e.metaKey && !e.ctrlKey && !e.altKey) {
    const target = e.target.tagName;
    if (target !== 'INPUT' && target !== 'TEXTAREA') {
      openViewer(num - 1);
    }
  }
});
</script>

</body>
</html>
