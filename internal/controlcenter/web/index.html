<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALF Control Center</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1><span>ALF</span> CC</h1>
      </div>
      <nav class="sidebar-nav" id="sidebarNav">
        <a class="nav-item active" data-view="home"><i data-lucide="home"></i> Home</a>
        <a class="nav-item" data-view="chat"><i data-lucide="message-circle"></i> Chat</a>
        <a class="nav-item" data-view="tasks"><i data-lucide="layers"></i> Tasks</a>
        <div class="nav-spacer" id="navSpacer"></div>
        <a class="nav-item" data-view="logs"><i data-lucide="scroll-text"></i> Logs</a>
        <a class="nav-item" data-view="docs"><i data-lucide="book-open"></i> Docs</a>
        <div class="sidebar-footer">
          <p>Made with ❤️ by <a href="https://x.com/a_lamparelli" target="_blank">@a_lamparelli</a></p>
          <p><a href="https://github.com/alamparelli" target="_blank"><i data-lucide="github"></i></a></p>
          <span class="sidebar-footer-label">Creator of:</span>
          <div class="sidebar-footer-links">
            <a href="https://dicta.to?utm_source=alf&amp;utm_medium=bio&amp;utm_campaign=generic" target="_blank">Dictato</a>
            <a href="https://quickpoll.cc?utm_source=alf&amp;utm_medium=bio&amp;utm_campaign=generic" target="_blank">QuickPoll</a>
            <a href="https://contacthive.app?utm_source=alf&amp;utm_medium=bio&amp;utm_campaign=generic" target="_blank">ContactHive</a>
          </div>
        </div>
      </nav>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main-content">
      <div class="main-header">
        <button class="hamburger" id="hamburgerBtn"><i data-lucide="menu"></i></button>
        <div class="header-controls">
          <button class="toggle-btn" id="themeToggle">Light</button>
        </div>
      </div>

      <div id="homeView">
        <!-- Status Card -->
        <div class="card" id="statusCard">
          <h2>Status</h2>
          <div class="status-grid">
            <div class="stat">
              <div class="stat-value"><span class="dot green" id="statusDot"></span></div>
              <div class="stat-label" id="uptimeValue">--</div>
            </div>
            <div class="stat">
              <div class="stat-value" id="lastMsg">--</div>
              <div class="stat-label">Last Message</div>
            </div>
          </div>
          <div class="stat-session-id" id="sessionIdLabel"></div>
        </div>

        <!-- Config Card -->

        <!-- Workspace Explorer -->
        <div class="card" id="workspaceCard">
          <h2>Workspace</h2>
          <div class="ws-breadcrumb" id="wsBreadcrumb"></div>
          <div class="explorer-split">
            <div class="explorer-sidebar">
              <div class="explorer-file-list" id="wsFileList"></div>
            </div>
            <div class="explorer-editor">
              <div class="explorer-editor-header">
                <span class="explorer-filename" id="wsFileName">Select a file</span>
                <div class="ws-editor-actions">
                  <button class="btn btn-icon" id="wsViewBtn" style="display:none" title="Pretty view"><i data-lucide="eye"></i></button>
                  <button class="btn btn-icon btn-danger-icon" id="wsDeleteBtn" disabled title="Delete file"><i data-lucide="trash-2"></i></button>
                  <button class="btn" id="wsSaveBtn" disabled>Save</button>
                </div>
              </div>
              <div class="ws-message" id="wsMessage" style="display:none"></div>
              <textarea class="json-editor" id="wsEditor" rows="12" placeholder="Select a file to view..." disabled style="display:none"></textarea>
              <div id="wsViewer" class="ws-viewer" style="display:none"></div>
            </div>
          </div>
          <div class="ws-drop-overlay" id="wsDropOverlay">
            <div class="ws-drop-content">
              <i data-lucide="upload-cloud" style="width:48px;height:48px"></i>
              <span>Drop files here</span>
            </div>
          </div>
        </div>

        <!-- Upload Modal -->
        <div class="modal-backdrop" id="uploadModal" style="display:none">
          <div class="modal">
            <h3>Upload files</h3>
            <div class="upload-file-list" id="uploadFileList"></div>
            <div class="form-row">
              <label>Destination</label>
              <select id="uploadTarget"></select>
            </div>
            <div class="form-row" id="uploadSubfolderRow">
              <label>Subfolder (optional)</label>
              <input type="text" id="uploadSubfolder" placeholder="e.g. my-skill">
            </div>
            <div class="form-row" id="uploadCustomRow" style="display:none">
              <label>Custom path</label>
              <input type="text" id="uploadCustomPath" placeholder="e.g. data/exports">
            </div>
            <div class="upload-actions">
              <button class="btn" id="uploadCancel">Cancel</button>
              <button class="btn btn-primary" id="uploadConfirm">Upload</button>
            </div>
            <div class="upload-progress" id="uploadProgress" style="display:none">
              <div class="upload-progress-bar" id="uploadProgressBar"></div>
            </div>
          </div>
        </div>

        <!-- Teach Card -->
        <div class="card" id="teachCard">
          <h2>Teach</h2>
          <div class="form-row">
            <label>Destination</label>
            <div class="segmented-control" id="teachDestination">
              <button class="seg-btn active" data-value="memory">Memory</button>
              <button class="seg-btn" data-value="context">Context file</button>
            </div>
          </div>
          <div class="form-row" id="teachFileNameRow" style="display:none">
            <label>File name</label>
            <div class="input-suffix-wrap">
              <input type="text" id="teachFileName" placeholder="e.g. project-notes">
              <span class="input-suffix">.md</span>
            </div>
          </div>
          <div class="form-row">
            <label>Instruction</label>
            <select id="teachPreset">
              <option value="Extract key facts">Extract key facts</option>
              <option value="Extract preferences">Extract preferences</option>
              <option value="Extract decisions">Extract decisions</option>
              <option value="store-as-is">Store as-is (one per line)</option>
              <option value="custom">Custom...</option>
            </select>
          </div>
          <div class="form-row" id="teachCustomRow" style="display:none">
            <label>Custom instruction</label>
            <input type="text" id="teachCustomInput" placeholder="e.g. Extract action items">
          </div>
          <div class="form-row" id="teachTierRow">
            <label>Tier</label>
            <select id="teachTier">
              <option value="">Loading...</option>
            </select>
          </div>
          <div style="position:relative">
            <textarea class="json-editor" id="teachContent" rows="8" placeholder="Paste content here (meeting notes, docs, preferences...)"></textarea>
            <div class="teach-counter" id="teachCounter">0 / 50KB</div>
          </div>
          <div class="teach-actions">
            <button class="btn" id="teachSubmit">Import</button>
            <span class="teach-result" id="teachResult"></span>
          </div>
        </div>
      </div>

      <div id="chatView" class="chat-view" style="display:none">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-status" id="chatStatus"></div>
        <div class="chat-input-bar">
          <textarea id="chatInput" placeholder="Message ALF..." rows="1"></textarea>
          <button class="btn chat-send-btn" id="chatSendBtn"><i data-lucide="send"></i></button>
        </div>
      </div>

      <div id="tasksView" class="tasks-view" style="display:none">
        <div class="tasks-toolbar">
          <h2>Orchestrator Tasks</h2>
          <div class="tasks-toolbar-right">
            <label class="logs-auto-label"><input type="checkbox" id="tasksAutoRefresh" checked> Auto</label>
            <button class="btn btn-icon" id="tasksRefreshBtn" title="Refresh"><i data-lucide="refresh-cw"></i></button>
          </div>
        </div>
        <div class="tasks-list" id="tasksList"></div>
      </div>

      <iframe id="pageFrame" class="page-frame" style="display:none"></iframe>

      <div id="logsView" class="logs-view" style="display:none">
        <div class="logs-toolbar">
          <select id="logSelect"></select>
          <div class="logs-toolbar-right">
            <select id="logLines">
              <option value="100">100 lines</option>
              <option value="200" selected>200 lines</option>
              <option value="500">500 lines</option>
              <option value="1000">1000 lines</option>
            </select>
            <label class="logs-auto-label"><input type="checkbox" id="logAutoRefresh" checked> Auto</label>
            <button class="btn btn-icon" id="logRefreshBtn" title="Refresh"><i data-lucide="refresh-cw"></i></button>
          </div>
        </div>
        <div class="logs-search-bar">
          <input type="text" id="logSearch" placeholder="Filter logs...">
        </div>
        <pre class="logs-output" id="logOutput"></pre>
      </div>

      <div id="docsView" class="docs-view" style="display:none">
        <div id="docsContent"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/static/marked.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
