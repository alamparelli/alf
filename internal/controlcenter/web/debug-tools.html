<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenRouter Tool Call Tester</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', monospace; background: #0a0a0a; color: #e0e0e0; padding: 20px; }
h1 { font-size: 16px; color: #888; margin-bottom: 16px; }

.row { display: flex; gap: 12px; margin-bottom: 12px; }
.row > * { flex: 1; }

label { display: block; font-size: 11px; color: #666; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
input, select, textarea { width: 100%; background: #141414; border: 1px solid #2a2a2a; color: #e0e0e0; padding: 8px 10px; border-radius: 6px; font-family: inherit; font-size: 13px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: #4a9eff; }
textarea { resize: vertical; min-height: 80px; }

button { background: #4a9eff; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: inherit; }
button:hover { background: #3a8eef; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button.secondary { background: #333; }
button.secondary:hover { background: #444; }
button.accent { background: #7c3aed; }
button.accent:hover { background: #6d28d9; }

.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.panel { background: #111; border: 1px solid #222; border-radius: 8px; overflow: hidden; }
.panel-header { background: #1a1a1a; padding: 8px 12px; font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center; }
.panel-body { padding: 12px; max-height: 500px; overflow-y: auto; }
.panel-body pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; line-height: 1.5; }

.tag { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; }
.tag-tool { background: #1a3a1a; color: #4ade80; }
.tag-text { background: #1a2a3a; color: #60a5fa; }
.tag-error { background: #3a1a1a; color: #f87171; }
.tag-hallucinated { background: #3a2a1a; color: #fbbf24; }

.status { font-size: 12px; color: #666; margin-top: 8px; }
.status.error { color: #f87171; }
.status.ok { color: #4ade80; }

.result-summary { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 12px; margin-top: 12px; }
.result-summary h3 { font-size: 13px; margin-bottom: 8px; color: #aaa; }
.verdict { font-size: 14px; font-weight: 600; padding: 8px; border-radius: 6px; margin-top: 8px; }
.verdict.real { background: #0a2a0a; color: #4ade80; border: 1px solid #1a4a1a; }
.verdict.fake { background: #2a1a0a; color: #fbbf24; border: 1px solid #4a3a1a; }
.verdict.none { background: #1a1a2a; color: #60a5fa; border: 1px solid #2a2a4a; }
.verdict.error { background: #2a0a0a; color: #f87171; border: 1px solid #4a1a1a; }

.history { margin-top: 16px; }
.history-item { background: #111; border: 1px solid #222; border-radius: 6px; padding: 10px; margin-bottom: 8px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
.history-item .model { color: #888; }

.presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.preset { background: #1a1a1a; border: 1px solid #2a2a2a; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; color: #aaa; }
.preset:hover { border-color: #4a9eff; color: #fff; }
.preset.active { border-color: #7c3aed; color: #c084fc; background: #1a1a2a; }

.json-key { color: #60a5fa; }
.json-str { color: #4ade80; }
.json-num { color: #fbbf24; }
.json-bool { color: #c084fc; }
.json-null { color: #666; }

.tier-bar { background: #111; border: 1px solid #2a2a2a; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
.tier-bar h2 { font-size: 12px; color: #666; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
.tier-stats { font-size: 11px; color: #888; margin-top: 6px; }
.tier-stats b { color: #c084fc; }
</style>
</head>
<body>

<h1>OpenRouter Tool Call Tester</h1>

<div class="tier-bar">
  <h2>Load from Alf</h2>
  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
    <span style="font-size:11px;color:#666;">Tier:</span>
    <div id="alfTiers" class="presets" style="margin-bottom:0;"></div>
    <span id="alfStatus" class="tier-stats"></span>
  </div>
</div>

<div class="row">
  <div>
    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="sk-or-..." />
  </div>
  <div>
    <label>Model</label>
    <input type="text" id="model" value="stepfun/step-3.5-flash:free" />
  </div>
</div>

<label>Quick models</label>
<div class="presets" id="presets"></div>

<div class="row">
  <div>
    <label>User message</label>
    <textarea id="prompt" rows="2">Create a file called test.txt with the content "hello world"</textarea>
  </div>
</div>

<div class="row">
  <div>
    <label>Tools (OpenAI format JSON)</label>
    <textarea id="tools" rows="10">[
  {
    "type": "function",
    "function": {
      "name": "write_file",
      "description": "Write content to a file.",
      "parameters": {
        "type": "object",
        "properties": {
          "path": { "type": "string", "description": "File path" },
          "content": { "type": "string", "description": "Content to write" }
        },
        "required": ["path", "content"],
        "additionalProperties": false
      },
      "strict": true
    }
  },
  {
    "type": "function",
    "function": {
      "name": "read_file",
      "description": "Read the contents of a file.",
      "parameters": {
        "type": "object",
        "properties": {
          "path": { "type": "string", "description": "File path" },
          "offset": { "type": ["integer", "null"], "description": "Start line (1-based)" },
          "limit": { "type": ["integer", "null"], "description": "Max lines" }
        },
        "required": ["path", "offset", "limit"],
        "additionalProperties": false
      },
      "strict": true
    }
  },
  {
    "type": "function",
    "function": {
      "name": "bash",
      "description": "Execute a bash command and return stdout/stderr.",
      "parameters": {
        "type": "object",
        "properties": {
          "command": { "type": "string", "description": "The command to run" }
        },
        "required": ["command"],
        "additionalProperties": false
      },
      "strict": true
    }
  }
]</textarea>
  </div>
</div>

<div class="row">
  <div>
    <label>System prompt (optional)</label>
    <textarea id="systemPrompt" rows="2">You have tools available. Use them to accomplish the user's request. Never simulate or hallucinate tool results.</textarea>
  </div>
</div>

<div style="display:flex;gap:8px;align-items:center;">
  <button id="sendBtn" onclick="send()">Send</button>
  <button class="secondary" onclick="sendNoTools()">Send without tools</button>
  <label style="display:inline-flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;">
    <input type="checkbox" id="streamToggle" checked /> Stream
  </label>
  <span id="status" class="status"></span>
</div>

<div class="panels">
  <div class="panel">
    <div class="panel-header">
      <span>Request sent</span>
      <button class="secondary" style="padding:2px 8px;font-size:10px;" onclick="copyPanel('reqBody')">Copy</button>
    </div>
    <div class="panel-body"><pre id="reqBody">-</pre></div>
  </div>
  <div class="panel">
    <div class="panel-header">
      <span>Response received</span>
      <button class="secondary" style="padding:2px 8px;font-size:10px;" onclick="copyPanel('resBody')">Copy</button>
    </div>
    <div class="panel-body"><pre id="resBody">-</pre></div>
  </div>
</div>

<div id="streamPanel" class="panel" style="margin-top:12px;display:none;">
  <div class="panel-header"><span>SSE stream (raw chunks)</span></div>
  <div class="panel-body" style="max-height:300px;"><pre id="streamBody"></pre></div>
</div>

<div id="summary" class="result-summary" style="display:none;">
  <h3>Analysis</h3>
  <div id="summaryContent"></div>
  <div id="verdict" class="verdict"></div>
</div>

<div class="history" id="history"></div>

<script>
const MODELS = [
  'stepfun/step-3.5-flash:free',
  'moonshotai/kimi-k2.5',
  'minimax/minimax-m2.5',
  'google/gemini-2.5-flash',
  'anthropic/claude-haiku-4-5',
  'deepseek/deepseek-chat-v3-0324:free',
  'meta-llama/llama-4-maverick:free',
  'qwen/qwen3-235b-a22b:free',
];

const presetsEl = document.getElementById('presets');
MODELS.forEach(m => {
  const el = document.createElement('div');
  el.className = 'preset';
  el.textContent = m.split('/')[1] || m;
  el.onclick = () => document.getElementById('model').value = m;
  presetsEl.appendChild(el);
});

// Load API key from localStorage.
const savedKey = localStorage.getItem('or_api_key');
if (savedKey) document.getElementById('apiKey').value = savedKey;
document.getElementById('apiKey').addEventListener('change', e => {
  localStorage.setItem('or_api_key', e.target.value);
});

// --- Alf tier loading (same-origin fetch) ---

async function loadTiers() {
  const tiersEl = document.getElementById('alfTiers');
  const statusEl = document.getElementById('alfStatus');
  try {
    const resp = await fetch('/api/debug/prompt');
    if (!resp.ok) { statusEl.textContent = 'Error ' + resp.status; return; }
    const data = await resp.json();
    tiersEl.innerHTML = '';
    for (const name of (data.tiers || [])) {
      const el = document.createElement('div');
      el.className = 'preset';
      el.textContent = name;
      el.onclick = () => loadTier(name, el);
      tiersEl.appendChild(el);
    }
  } catch(e) {
    statusEl.textContent = 'CC not reachable (open this page from your Control Center)';
    statusEl.className = 'tier-stats error';
  }
}

async function loadTier(tierName, el) {
  const statusEl = document.getElementById('alfStatus');
  // Highlight active.
  document.querySelectorAll('#alfTiers .preset').forEach(p => p.classList.remove('active'));
  if (el) el.classList.add('active');

  try {
    const resp = await fetch('/api/debug/prompt?tier=' + encodeURIComponent(tierName));
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();

    if (data.model) document.getElementById('model').value = data.model;
    document.getElementById('systemPrompt').value = data.full_prompt || '';
    if (data.tools && data.tools.length > 0) {
      document.getElementById('tools').value = JSON.stringify(data.tools, null, 2);
    } else {
      document.getElementById('tools').value = '[]';
    }

    const promptLen = (data.full_prompt || '').length;
    const tokEst = Math.round(promptLen / 4);
    const toolNames = (data.tool_names || []).join(', ');

    statusEl.innerHTML = '<b>' + tierName + '</b> loaded &mdash; ' +
      data.model + ' (' + (data.backend || 'cli') + ') &bull; ' +
      promptLen + ' chars (~' + tokEst + ' tokens) &bull; ' +
      (data.tools || []).length + ' tools' +
      (toolNames ? ' (' + toolNames + ')' : '');
    statusEl.className = 'tier-stats ok';

    // Auto-resize textareas.
    ['systemPrompt', 'tools'].forEach(id => {
      const ta = document.getElementById(id);
      ta.style.height = 'auto';
      ta.style.height = Math.min(300, ta.scrollHeight) + 'px';
    });
  } catch(e) {
    statusEl.textContent = 'Error: ' + e.message;
    statusEl.className = 'tier-stats error';
  }
}

// Load tiers on page open.
loadTiers();

// --- OpenRouter API ---

function syntaxHighlight(json) {
  if (typeof json !== 'string') json = JSON.stringify(json, null, 2);
  return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, match => {
    let cls = 'json-num';
    if (/^"/.test(match)) {
      cls = /:$/.test(match) ? 'json-key' : 'json-str';
    } else if (/true|false/.test(match)) {
      cls = 'json-bool';
    } else if (/null/.test(match)) {
      cls = 'json-null';
    }
    return '<span class="' + cls + '">' + match + '</span>';
  });
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + (cls || '');
}

function copyPanel(id) {
  navigator.clipboard.writeText(document.getElementById(id).textContent);
}

async function sendNoTools() { await doSend(false); }
async function send() { await doSend(true); }

async function doSend(withTools) {
  const apiKey = document.getElementById('apiKey').value.trim();
  const model = document.getElementById('model').value.trim();
  const prompt = document.getElementById('prompt').value.trim();
  const systemPrompt = document.getElementById('systemPrompt').value.trim();
  const stream = document.getElementById('streamToggle').checked;

  if (!apiKey || !model || !prompt) {
    setStatus('Fill in API key, model, and message', 'error');
    return;
  }

  let tools = [];
  if (withTools) {
    try {
      tools = JSON.parse(document.getElementById('tools').value);
    } catch(e) {
      setStatus('Invalid tools JSON: ' + e.message, 'error');
      return;
    }
  }

  const messages = [];
  if (systemPrompt) messages.push({ role: 'system', content: systemPrompt });
  messages.push({ role: 'user', content: prompt });

  const body = { model, messages, stream, max_tokens: 2048 };
  if (withTools && tools.length > 0) body.tools = tools;

  document.getElementById('reqBody').innerHTML = syntaxHighlight(body);
  document.getElementById('resBody').textContent = 'Loading...';
  document.getElementById('summary').style.display = 'none';
  document.getElementById('streamPanel').style.display = stream ? 'block' : 'none';
  document.getElementById('streamBody').textContent = '';

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  setStatus('Sending...', '');
  const t0 = Date.now();

  try {
    const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey,
        'HTTP-Referer': 'https://github.com/alamparelli/alf',
        'X-Title': 'ALF Tool Test',
      },
      body: JSON.stringify(body),
    });

    if (!resp.ok) {
      const errText = await resp.text();
      document.getElementById('resBody').innerHTML = syntaxHighlight({ status: resp.status, body: errText });
      setStatus('Error ' + resp.status, 'error');
      btn.disabled = false;
      return;
    }

    if (stream) {
      await handleStream(resp, t0, withTools, model);
    } else {
      const data = await resp.json();
      const elapsed = Date.now() - t0;
      document.getElementById('resBody').innerHTML = syntaxHighlight(data);
      setStatus(elapsed + 'ms', 'ok');
      analyzeResponse(data, withTools, model, elapsed);
    }
  } catch(e) {
    document.getElementById('resBody').textContent = 'Fetch error: ' + e.message;
    setStatus('Network error', 'error');
  }
  btn.disabled = false;
}

async function handleStream(resp, t0, withTools, model) {
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  const streamEl = document.getElementById('streamBody');

  let fullText = '';
  let toolCalls = {};
  let finishReason = '';
  let chunks = 0;
  let buffer = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();

    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const payload = line.slice(6).trim();
      if (payload === '[DONE]') {
        streamEl.textContent += '\n[DONE]';
        continue;
      }

      chunks++;
      try {
        const chunk = JSON.parse(payload);
        streamEl.textContent += 'chunk ' + chunks + ': ' + JSON.stringify(chunk.choices?.[0]?.delta || {}) + '\n';
        streamEl.parentElement.scrollTop = streamEl.parentElement.scrollHeight;

        for (const choice of (chunk.choices || [])) {
          if (choice.finish_reason) finishReason = choice.finish_reason;
          if (choice.delta?.content) fullText += choice.delta.content;
          for (const tc of (choice.delta?.tool_calls || [])) {
            if (!toolCalls[tc.index]) toolCalls[tc.index] = { id: '', name: '', arguments: '' };
            const existing = toolCalls[tc.index];
            if (tc.id) existing.id = tc.id;
            if (tc.function?.name) existing.name += tc.function.name;
            if (tc.function?.arguments) existing.arguments += tc.function.arguments;
          }
        }
      } catch(e) {
        streamEl.textContent += 'parse error: ' + payload.slice(0, 100) + '\n';
      }
    }
  }

  const elapsed = Date.now() - t0;
  const calls = Object.values(toolCalls);
  const reconstructed = {
    text: fullText || null,
    tool_calls: calls.length > 0 ? calls : null,
    finish_reason: finishReason,
    chunks,
    elapsed_ms: elapsed,
  };

  document.getElementById('resBody').innerHTML = syntaxHighlight(reconstructed);
  setStatus(elapsed + 'ms, ' + chunks + ' chunks', 'ok');
  analyzeResponse({ _reconstructed: true, text: fullText, tool_calls: calls, finish_reason: finishReason }, withTools, model, elapsed);
}

function analyzeResponse(data, withTools, model, elapsed) {
  const summaryEl = document.getElementById('summary');
  const contentEl = document.getElementById('summaryContent');
  const verdictEl = document.getElementById('verdict');
  summaryEl.style.display = 'block';

  let text, toolCalls, finish;

  if (data._reconstructed) {
    text = data.text || '';
    toolCalls = data.tool_calls || [];
    finish = data.finish_reason;
  } else {
    const choice = data.choices?.[0];
    text = choice?.message?.content || '';
    toolCalls = choice?.message?.tool_calls || [];
    finish = choice?.finish_reason;
  }

  const hasRealToolCalls = toolCalls.length > 0;
  const hallucinationPatterns = [
    /\[Used tool:/i, /\[Tool result:/i, /```tool_call/i,
    /\btool_call\s*:/i, /<tool_call>/i, /<function=/i,
    /\bwrite_file\s*\(/i, /\bread_file\s*\(/i,
  ];
  const hasHallucinated = hallucinationPatterns.some(p => p.test(text));

  let html = '<div style="font-size:12px;line-height:1.8;">';
  html += '<div>finish_reason: <span class="tag tag-text">' + (finish || 'unknown') + '</span></div>';
  html += '<div>Text content: ' + (text ? text.length + ' chars' : 'empty') + '</div>';
  html += '<div>Real tool_calls: ' + (hasRealToolCalls ? '<span class="tag tag-tool">' + toolCalls.length + ' calls</span>' : 'none') + '</div>';

  if (hasRealToolCalls) {
    toolCalls.forEach((tc, i) => {
      const fn = tc.function || tc;
      html += '<div style="margin-left:12px;color:#4ade80;">  [' + i + '] ' + (fn.name || tc.name || '?') + '(' + (fn.arguments || tc.arguments || '').slice(0, 100) + ')</div>';
    });
  }

  if (hasHallucinated) {
    html += '<div>Hallucinated tool calls: <span class="tag tag-hallucinated">DETECTED in text</span></div>';
  }

  if (text && text.length > 0) {
    html += '<div style="margin-top:8px;color:#888;font-size:11px;">Text preview: ' + text.slice(0, 200).replace(/</g, '&lt;') + (text.length > 200 ? '...' : '') + '</div>';
  }
  html += '</div>';
  contentEl.innerHTML = html;

  if (!withTools) {
    verdictEl.className = 'verdict none';
    verdictEl.textContent = 'No tools sent (baseline test)';
  } else if (hasRealToolCalls && !hasHallucinated) {
    verdictEl.className = 'verdict real';
    verdictEl.textContent = 'REAL tool calls via API';
  } else if (hasRealToolCalls && hasHallucinated) {
    verdictEl.className = 'verdict fake';
    verdictEl.textContent = 'MIXED — real tool_calls + hallucinated text';
  } else if (hasHallucinated) {
    verdictEl.className = 'verdict fake';
    verdictEl.textContent = 'HALLUCINATED — faked tool calls in text';
  } else if (!text && !hasRealToolCalls) {
    verdictEl.className = 'verdict error';
    verdictEl.textContent = 'EMPTY RESPONSE';
  } else {
    verdictEl.className = 'verdict none';
    verdictEl.textContent = 'TEXT ONLY — no tool calls';
  }

  addHistory(model, verdictEl.textContent, elapsed);
}

function addHistory(model, verdict, elapsed) {
  const el = document.createElement('div');
  el.className = 'history-item';
  el.innerHTML = '<span class="model">' + model + '</span><span>' + verdict.slice(0, 60) + '</span><span>' + elapsed + 'ms</span>';
  document.getElementById('history').insertBefore(el, document.getElementById('history').firstChild);
}
</script>

</body>
</html>
