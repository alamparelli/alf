changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: "🔒 Security"
      labels: [security]
    - title: "🚀 Features"
      labels: [feature, enhancement]
    - title: "🐛 Bug Fixes"
      labels: [fix, bug]
    - title: "🔧 Maintenance"
      labels: [refactor, chore, ci]
    - title: "📖 Documentation"
      labels: [docs]
    - title: "Other Changes"
      labels: ["*"]
