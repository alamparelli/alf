<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALF Control Center</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1><span>ALF</span> Control Center</h1>
      <div class="header-controls">
        <button class="toggle-btn" id="themeToggle">Light</button>
      </div>
    </header>

    <!-- Status Card -->
    <div class="card" id="statusCard">
      <h2>Status</h2>
      <div class="status-grid">
        <div class="stat">
          <div class="stat-value"><span class="dot green" id="statusDot"></span><span id="statusText">--</span></div>
          <div class="stat-label">Status</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="uptimeValue">--</div>
          <div class="stat-label">Uptime</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="msgCount">0</div>
          <div class="stat-label">Messages</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="lastMsg">--</div>
          <div class="stat-label">Last Message</div>
        </div>
      </div>
    </div>

    <!-- Config Card -->
    <div class="card">
      <h2>Configuration</h2>
      <div class="form-row">
        <label>Log Level</label>
        <span class="ro-value" id="cfgLogLevel">--</span>
      </div>
      <div class="form-row">
        <label>Quiet Hours</label>
        <span class="ro-value" id="cfgQuietHours">--</span>
      </div>
      <div class="form-row">
        <label>System Prompt</label>
        <span class="ro-value" id="cfgSystemPrompt">--</span>
      </div>
    </div>

    <!-- Workspace Explorer -->
    <div class="card" id="workspaceCard">
      <h2>Workspace</h2>
      <div class="ws-breadcrumb" id="wsBreadcrumb"></div>
      <div class="explorer-split">
        <div class="explorer-sidebar">
          <div class="explorer-file-list" id="wsFileList"></div>
        </div>
        <div class="explorer-editor">
          <div class="explorer-editor-header">
            <span class="explorer-filename" id="wsFileName">Select a file</span>
            <div class="ws-editor-actions">
              <button class="btn btn-icon btn-danger-icon" id="wsDeleteBtn" disabled title="Delete file"><i data-lucide="trash-2"></i></button>
              <button class="btn" id="wsSaveBtn" disabled>Save</button>
            </div>
          </div>
          <div class="ws-message" id="wsMessage" style="display:none"></div>
          <textarea class="json-editor" id="wsEditor" rows="12" placeholder="Select a file to view..." disabled style="display:none"></textarea>
        </div>
      </div>
    </div>

  </div>

  <div class="toast" id="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
